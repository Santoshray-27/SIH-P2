/* ===== Landing motion layer (scoped to body.lp) ===== */
body.lp{--bg:#FCF6E9;--s1:#FFFBF3;--s2:#F4EAD4;--line:#E7DABB;--mut:#6A675C;--ink:#16224A;--pri:#17306B;--pric:#FBF7EC;--ok:#1F6B3B;--warn:#9A5200;--bad:#A3271D;--okb:#DCE8D0;--warnb:#F6E0B5;--badb:#F2D3C8;color-scheme:light}

:root{--acc:#D9701A;--sh:0 1px 2px rgba(23,48,107,.06),0 14px 26px -20px rgba(23,48,107,.35)}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 520px at 6% -6%,rgba(246,201,142,.42),transparent 62%),radial-gradient(800px 520px at 100% 18%,rgba(201,216,242,.38),transparent 62%),radial-gradient(700px 500px at 40% 110%,rgba(207,227,196,.4),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11"}
body.lp{background:var(--bg)}
input,select,textarea,button{font-family:inherit}
h1,h2,h3{letter-spacing:-.02em;color:var(--ink)}
::selection{background:#F6C98E;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#D9C79C transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.card,.spec,.stats,.proc{border-radius:14px}.stats,.proc{overflow:hidden}
.card{position:relative;box-shadow:var(--sh);border-color:var(--line)}
.btn{border-radius:10px}.badge{border-radius:99px}.step i{border-radius:99px}
.banner,.toast,.doc,.drop{border-radius:10px}nav.side a{border-radius:10px}.lnav button{border-radius:8px}
.top{background:rgba(255,251,243,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media(min-width:761px){nav.side{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);background:rgba(255,251,243,.35)}}
nav.side a{transition:background .2s,color .2s,transform .2s}nav.side a:hover:not(.on){transform:translateX(3px)}
nav.side a.on{background:linear-gradient(135deg,var(--pri),#2A4A9A);box-shadow:inset 3px 0 0 var(--acc),0 8px 18px -10px rgba(23,48,107,.6)}
.btn{transition:transform .15s,box-shadow .25s,background .2s}.btn:hover:not(:disabled){box-shadow:0 8px 18px -8px rgba(23,48,107,.5);transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn.alt:hover:not(:disabled){background:var(--s2);box-shadow:none}
.card,.persona button,.bell{transition:transform .25s,box-shadow .25s,border-color .25s}
tr.row td{transition:background .15s}.persona button:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:18px;top:0;width:30px;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.kpi b{background:linear-gradient(135deg,var(--ink),var(--pri));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.srch,.in,input[type=number]{transition:box-shadow .2s,border-color .2s;background:var(--s1)}
.srch:focus,.in:focus,input[type=number]:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,112,26,.18)}
.step i.on{box-shadow:0 0 0 4px rgba(23,48,107,.12)}
.diff .ch{animation:hl 1.8s ease}@keyframes hl{from{background:#F2B866}}
.badge,.sim{letter-spacing:.01em}.sim{border-radius:99px;padding:0 8px;background:rgba(246,224,181,.5)}
.hash,.mono,code{font-variant-ligatures:none}
th{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.crumb a{text-decoration:none;color:var(--pri)}.crumb a:hover{text-decoration:underline}
.foot{background:rgba(244,234,212,.7)}
@keyframes pe{from{opacity:0;transform:translateY(10px)}}
.toast{animation:pe .35s ease both}
@media(prefers-reduced-motion:no-preference){#app.pe>*{animation:pe .5s cubic-bezier(.2,.8,.2,1) both}#app.pe>.lh{animation:none}}
@media(prefers-reduced-motion:reduce){.btn,.card,nav.side a,.persona button{transition:none}.diff .ch{animation:none}}
@media print{.top,nav.side,.fxbg,.pg,.cd,.cr,.fxs{display:none!important}body{background:#fff}}
</style></head><body>
<div id="app"></div>
<script>
const B=(t,c,i)=>`<span class="badge b-${c}"><span aria-hidden="true">${i}</span>${t}</span>`;
const SIM='<a class="sim" href="#transparency">Simulated</a>';
const ST={ver:B('Verified','ok','✓'),ro:B('Awaiting RO','warn','◐'),od:B('Overdue','bad','▲'),evc:B('EVC eligible','ok','●'),def:B('Returned','bad','↩'),sub:B('Submitted','n','○')};
const ROLES={
 inst:{n:'Institution',who:'Sri Venkateswara Institute of Technology',home:'inst',nav:[['inst','Dashboard'],['new','New application'],['obl','Obligations'],['docs','Document vault']]},
 ro:{n:'Regional Officer',who:'R. Menon · Central Region',home:'ro',nav:[['ro','Dashboard'],['queue','Case queue'],['scrutiny','Scrutiny workspace'],['rehearsal','Rehearsal sandbox'],['evc','EVC scheduling']]},
 bureau:{n:'Regulation Bureau',who:'A. Kapoor · HQ',home:'bureau',nav:[['bureau','National dashboard'],['rules','Rules & workflows'],['audit','Audit trail']]}
};
let role=null,tamper=false,ran=false,lease=25,verified=null;
const logo=`<a class="logo" href="#login"><svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 17V9m26 8V9M2 9c6-10 20-10 26 0M9 17V8m6 9V4m6 13V8"/></svg>NiyamSetu</a>`;
const shell=(route,body)=>`<header class="top">${logo}<div class="sp"></div><input class="srch" type="search" aria-label="Search cases" placeholder="Search case or institution" onkeydown="if(event.key=='Enter')go('scrutiny')"><span class="who">${ROLES[role].who}</span><a class="bell" href="#notif" aria-label="Alerts, 4 unread">Alerts<b>4</b></a>
<label class="who">View as <select aria-label="Switch demo persona" onchange="go(this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==role?'selected':''}>${v.n}</option>`).join('')}</select></label>${SIM.replace('Simulated','Demo persona')}</header>
<div class="shell"><nav class="side" aria-label="Main">${ROLES[role].nav.map(([r,l])=>`<a href="#${r}" class="${r==route?'on':''}"${r==route?' aria-current="page"':''}>${l}</a>`).join('')}<a href="#transparency" style="margin-top:auto">What’s real vs simulated</a></nav><main class="fx"><div class="crumb">${ROLES[role].n} / ${(ROLES[role].nav.find(n=>n[0]==route)||[0,'Alerts'])[1]}</div>${body}</main></div>`;
const kpi=a=>`<div class="grid g4">${a.map(([n,l])=>`<div class="card kpi"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;

const V={
login:()=>`<div class="login fx"><div>${logo}<h1 style="margin-top:28px">Every case on the right path.</h1>
<p class="sub">NiyamSetu connects a regulation to the action it governs, so each AICTE approval is routed, timed and traceable from submission to decision.</p>
<div class="bridge"><span><b>Submit</b>institution files</span><span><b>Route</b>by statutory category</span><span><b>Verify</b>officer checks evidence</span><span><b>Decide</b>competent authority</span></div>
<div class="banner">All accounts and data are synthetic. See <a href="#transparency">what’s real and what’s simulated</a>.</div></div>
<div><h2>Choose a demo role</h2><div class="persona">${Object.entries(ROLES).map(([k,v])=>`<button onclick="go('${k}')"><b>${v.n}</b><span>${v.who}</span></button>`).join('')}</div>
<p class="who" style="margin-top:14px">Regional Officer and Bureau roles require two-step verification in the full build.</p></div></div>`,

inst:()=>shell('inst',`<h1>Good morning, Sri Venkateswara Institute</h1><p class="sub">Two items need your action before their deadlines.</p>
${kpi([[3,'Active applications'],[2,'Obligations due soon'],[1,'Documents expiring'],[4,'Unread notifications']])}
<div class="card" style="margin-top:14px"><h2>Needs your action</h2><div class="mx"><table><tr><th>Item</th><th>Status</th><th>Due</th></tr>
<tr><td>Fire safety certificate: renew<br><span class="mono hash">DOC-0412</span></td><td>${B('Expires in 12 days','bad','▲')}</td><td>11 Nov 2026</td></tr>
<tr><td>Lease deed: correct tenure and resubmit<br><span class="mono hash">APP-2026-0014</span></td><td>${ST.def}</td><td>6 Nov 2026</td></tr>
<tr><td>Faculty undertaking: upload evidence</td><td>${B('Due in 21 days','warn','◐')}</td><td>20 Nov 2026</td></tr></table></div></div>
<div class="card" style="margin-top:14px"><h2>Application APP-2026-0014 · New institute (LOA)</h2>
<div class="step"><i class="done">✓ Submitted</i><i class="on">Scrutiny</i><i>EVC visit</i><i>Hearing</i><i>Decision</i></div>
<p class="who">Governed by workflow <span class="mono">LOA v3.1</span>, pinned when you applied. Stage deadline: 6 days left.</p></div>`),

new:()=>shell('new',`<h1>New application</h1><p class="sub">Choose a category. The statutory route that will govern your case appears immediately.</p>
<div class="grid g2">${[['New institute (LOA)','Submitted → Scrutiny → EVC visit → Hearing → Decision'],['Extension of approval, standard','Submitted → Scrutiny → Decision'],['Extension, 3-year merit track','Submitted → Eligibility check → Decision'],['Infrastructure modification','Submitted → EVC visit → Hearing → Decision']].map(([t,r],i)=>`<label class="card" style="display:block;cursor:pointer"><input type="radio" name="c" ${i==0?'checked':''}> <b>${t}</b><div class="who mono" style="margin-top:8px">${r}</div></label>`).join('')}</div>
<p class="who" style="margin-top:14px">Route patterns are prototype routes, pending confirmation against the current Approval Process Handbook.</p><button class="btn" style="margin-top:8px" onclick="alert('Next: details, documents, review.')">Continue to details</button>`),

ro:()=>shell('ro',`<h1>Central Region</h1><p class="sub">Oldest cases first. Open one to scrutinise or rehearse.</p>
${kpi([[18,'Pending'],[3,'Overdue'],[4,'EVC eligible'],[5,'Obligations to review']])}
<div class="card" style="margin-top:14px"><h2>Case queue</h2><div class="mx"><table><tr><th>Case</th><th>Category</th><th>Stage</th><th>Age</th><th>Status</th></tr>
${[['APP-2026-0014','LOA','Scrutiny','31 days',ST.ro],['APP-2026-0009','EOA standard','Scrutiny','44 days',ST.od],['APP-2026-0021','Infra modification','EVC','12 days',ST.evc],['APP-2026-0003','EOA 3-year merit','Eligibility','6 days',ST.ver]].map(r=>`<tr class="row" tabindex="0" onclick="go('scrutiny')" onkeydown="if(event.key=='Enter')go('scrutiny')"><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div></div>`),

rehearsal:()=>shell('rehearsal',`<h1>Rehearsal sandbox · APP-2026-0014</h1><p class="sub">Test a change against the whole case before you act. Nothing here touches the real record.</p>
<div class="banner"><b>Simulation only</b> · <span class="mono">production_modified: false</span> · runs in an isolated database schema with a read-only role.</div>
<div class="cmp"><div class="card"><h2>Baseline (real case)</h2>
<div class="field"><span>Lease tenure</span><span>25 years</span></div><div class="field"><span>Rule: tenure ≥ 30 years</span><span>${B('Fails','bad','▲')}</span></div><div class="field"><span>EVC eligibility</span><span>No</span></div><div class="field"><span>Stage deadline</span><span>6 Nov 2026</span></div><div class="field"><span>Evidence source</span><span>Declared · not verified</span></div></div>
<div class="card" style="border-color:var(--pri)"><h2>Hypothetical edit</h2><div class="field"><span><label for="l">Lease tenure (years)</label></span><span><input id="l" type="number" min="1" max="99" value="${lease}" onchange="lease=+this.value;ran=false"></span></div>
<p class="who">Try 30 or more to see the effect ripple through the case.</p><button class="btn" onclick="ran=true;go('rehearsal');document.getElementById('rr').scrollIntoView({block:'nearest'})">Run rehearsal</button></div></div>
${ran?(()=>{const p=lease>=30;const rows=[['Rule outcome','Fails',p?'Passes':'Fails'],['Stage eligibility','Scrutiny only',p?'Scrutiny and EVC':'Scrutiny only'],['EVC eligibility','No',p?'Yes':'No'],['Stage deadline','6 Nov 2026',p?'9 Nov 2026':'6 Nov 2026'],['Notification',' None',p?'“Case cleared for EVC scheduling” to institution':'None']];
return `<div class="card fx" id="rr" style="margin-top:14px"><h2>What changes</h2>${rows.map(r=>`<div class="diff ${r[1].trim()==r[2].trim()?'same':''}"><b>${r[0]}</b><span class="old">${r[1]}</span><span class="ar" aria-hidden="true">→</span><span class="ch">${r[2]}</span></div>`).join('')}
<p class="who">${p?'Notification preview is simulated and was not sent. ':'No downstream effect: the rule still fails. '}${SIM}</p>
<div style="display:flex;gap:10px;margin-top:8px"><button class="btn" onclick="go('scrutiny')">Apply in scrutiny workspace</button><button class="btn alt" onclick="ran=false;go('rehearsal')">Discard</button></div></div>`})():''}`),

bureau:()=>shell('bureau',`<h1>National overview</h1><p class="sub">All regions, same filters as every export.</p>
${kpi([[212,'Open cases'],[17,'Overdue'],[9,'Escalations this week'],['94%','Alerts delivered on time']])}
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Pendency by stage</h2>${[['Scrutiny',100],['EVC visit',62],['Hearing',28],['Decision',14]].map(([l,w])=>`<div>${l}<div class="bar" style="width:${w}%">${Math.round(w*1.1)}</div></div>`).join('')}</div>
<div class="card"><h2>Overdue by region</h2>${[['Central',6],['Southern',4],['Western',3],['Eastern',2],['Northern',2]].map(([l,w])=>`<div>${l}<div class="bar" style="width:${w*16}%;background:var(--warn)">${w}</div></div>`).join('')}</div></div>`),

audit:()=>shell('audit',`<h1>Audit trail</h1><p class="sub">Each entry is chained to the one before and digitally signed.</p>
<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><button class="btn" onclick="verified=tamper?'bad':'ok';go('audit')">Verify chain integrity</button><button class="btn alt" onclick="tamper=!tamper;verified=null;go('audit')">${tamper?'Undo tamper':'Inject a tamper (demo)'}</button></div>
${verified?`<div class="toast ${verified=='ok'?'b-ok':'b-bad'}" role="status">${verified=='ok'?'✓ All 6 entries verified. Chain intact.':'▲ Verification failed at entry #4: the stored hash no longer matches its contents.'}</div>`:''}
<div class="card mx" style="margin-top:14px"><table><tr><th>#</th><th>Actor</th><th>Action</th><th>Case</th><th>Hash</th></tr>
${[['R. Menon','Returned for correction','0014'],['Institution','Resubmitted','0014'],['R. Menon','Ran rehearsal (simulation)','0014'],['R. Menon','Advanced to EVC','0014'],['System','15-day alert sent','0014'],['A. Kapoor','Acknowledged escalation','0009']].map((r,i)=>`<tr class="${tamper&&i==3?'tamper':''}"><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}${tamper&&i==3?' '+B('Altered','bad','▲'):''}</td><td class="mono">${r[2]}</td><td class="mono hash">${tamper&&i==3?'e0f1…77aa':'a'+(i+3)+'c9…'+(i*7+11)+'d2'}</td></tr>`).join('')}</table></div>`),

transparency:()=>`<div style="max-width:840px;margin:0 auto;padding:36px 20px" class="fx">${logo}<h1 style="margin-top:24px">What’s real and what’s simulated</h1><p class="sub">Anything backed by a mock adapter carries a ${SIM} tag everywhere in the app.</p>
<div class="card mx"><table><tr><th>Capability</th><th>Status</th><th>Path to real</th></tr>
${[['Workflow engine, routing, deadline scheduler, rehearsal sandbox, signed audit ledger','ok','Real','Hardening and load tests'],['Bank or external financial confirmation','warn','Simulated','Inter-agency agreement'],['SMS and WhatsApp delivery','warn','Simulated','Authorised NIC or Meta Business account'],['AICTE existing-system integration','warn','Mock records','AICTE IT coordination'],['EVC GPS geotagging','warn','Simulated','Device-level geofencing in a field app']].map(r=>`<tr><td>${r[0]}</td><td>${B(r[2],r[1],r[1]=='ok'?'✓':'◐')}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
<p><a href="#${role?ROLES[role].home:'login'}">Back to the app</a></p></div>`
};
let ws=0,cat=0,flt='All',vf=[0,0,0],sch=0,pv=0;
const CATS=[['New institute (LOA)','Submitted → Scrutiny → EVC visit → Hearing → Decision','LOA v3.1'],['Extension of approval, standard','Submitted → Scrutiny → Decision','EOA-S v2.4'],['Extension, 3-year merit track','Submitted → Eligibility check → Decision','EOA-3Y v1.2'],['Infrastructure modification','Submitted → EVC visit → Hearing → Decision','INFRA v2.0']];
const wz=n=>`<div class="step" aria-label="Step ${n+1} of 4">${['Category','Details','Documents','Review'].map((l,i)=>`<i class="${i<n?'done':i==n?'on':''}">${i<n?'✓ ':''}${l}</i>`).join('')}</div>`;
function nx(d){ws+=d;if(ws>3){ws=0;go('inst');return}go('new')}
function cf(i){vf[i]=1;go('scrutiny')}
const CASES=[['APP-2026-0014','LOA','Scrutiny','31 days','6 Nov 2026','R. Menon',ST.ro,'Scrutiny'],['APP-2026-0009','EOA standard','Scrutiny','44 days','28 Oct 2026','S. Iyer',ST.od,'Overdue'],['APP-2026-0021','Infra modification','EVC','12 days','19 Nov 2026','R. Menon',ST.evc,'EVC eligible'],['APP-2026-0003','EOA 3-year merit','Eligibility','6 days','24 Nov 2026','S. Iyer',ST.ver,'Scrutiny']];
const tbl=(h,rows)=>`<div class="mx"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
Object.assign(V,{
new:()=>shell('new',`<h1>New application</h1><p class="sub">Four steps. The statutory route is pinned to your case when you submit.</p>${wz(ws)}`+[
`<div class="grid g2">${CATS.map((c,i)=>`<label class="card pick"><input type="radio" name="c" ${i==cat?'checked':''} onchange="cat=${i}"> <b>${c[0]}</b><div class="who mono" style="margin-top:8px">${c[1]}</div></label>`).join('')}</div><p class="who" style="margin-top:12px">Route patterns are prototype routes, pending confirmation against the current Approval Process Handbook.</p>`,
`<div class="card"><div class="field"><span>Institution</span><span>Sri Venkateswara Institute of Technology</span></div><div class="field"><span>Academic year</span><span>2027–28</span></div><div class="field"><label for="ld">Lease tenure declared (years)</label><input class="in" id="ld" type="number" value="25" style="width:90px"></div></div>`,
`<div class="card"><div class="drop">Drag files here or browse. PDF or image, up to 10 MB each.</div>${tbl(['Document','Status'],[['Land and lease deed',B('Uploaded','ok','✓')],['Fire safety certificate',B('Uploaded','ok','✓')],['Building plan',B('Missing','bad','▲')]])}</div>`,
`<div class="card"><h2>Ready to submit</h2><div class="field"><span>Category</span><span>${CATS[cat][0]}</span></div><div class="field"><span>Workflow version pinned</span><span class="mono">${CATS[cat][2]}</span></div><div class="field"><span>First stage deadline</span><span>Scrutiny, 30 days</span></div><p class="who">Your case keeps this version unless an authorised migration is recorded in the audit trail.</p></div>`][ws]
+`<div class="act"><button class="btn alt" ${ws?'':'disabled'} onclick="nx(-1)">Back</button><button class="btn" onclick="nx(1)">${ws<3?'Continue':'Submit application'}</button></div>`),
queue:()=>shell('queue',`<h1>Case queue</h1><p class="sub">Filter by status. Open a case to scrutinise it.</p><div class="chips" role="group" aria-label="Filter">${['All','Overdue','EVC eligible','Scrutiny'].map(f=>`<button aria-pressed="${f==flt}" onclick="flt='${f}';go('queue')">${f}</button>`).join('')}</div>
<div class="card">${tbl(['Case','Category','Stage','Age','Deadline','Officer','Status'],CASES.filter(c=>flt=='All'||c[7]==flt).map(c=>[`<a class="mono" href="#scrutiny">${c[0]}</a>`,c[1],c[2],c[3],c[4],c[5],c[6]]))}</div>`),
scrutiny:()=>shell('scrutiny',`<h1>Scrutiny · APP-2026-0014</h1><p class="sub">Declared, extracted and verified values stay separate. Only you can mark a value verified.</p>
<div class="split"><div class="doc"><b>Lease deed, page 2</b><br>…the Lessor grants the premises to the Lessee for a term of <mark>twenty-five (25) years</mark> commencing <mark>1 April 2026</mark>, over land measuring <mark>4.2 acres</mark>…</div>
<div class="card">${tbl(['Field','Declared','Extracted','Verified'],[['Lease tenure','25 years','25 years · 92%'],['Lease start','1 Apr 2026','1 Apr 2026 · 88%'],['Land area','4.2 acres','4.2 acres · 97%']].map((r,i)=>[...r,vf[i]?B('You, today','ok','✓'):`<button class="btn alt sm" onclick="cf(${i})">Confirm</button>`]))}<p class="who" style="margin:10px 0 0">Extraction is a suggestion with a confidence score, never a verification.</p></div></div>
<div class="card"><h2>Decision</h2><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><label for="rs" class="who">Reason</label><input class="in" id="rs" style="flex:1;min-width:200px" placeholder="Required to return a case"><button class="btn alt" onclick="const v=document.getElementById('rs').value.trim();document.getElementById('rm').textContent=v?'Returned to institution. Audit entry written.':'A reason is required to return a case.'">Return</button><button class="btn alt" onclick="go('evc')">Flag for EVC</button><button class="btn" onclick="go('rehearsal')">Open in rehearsal sandbox</button></div><p id="rm" class="who" role="status" style="margin:10px 0 0"></p></div>`),
evc:()=>shell('evc',`<h1>EVC scheduling</h1><p class="sub">A completed visit is not an accepted report. Both are tracked.</p><div class="grid g2"><div class="card"><h2>Eligible: APP-2026-0021</h2><p class="who">Infra modification · Central Region</p><div class="field"><label for="dt">Visit date</label><input class="in" id="dt" type="date" value="2026-11-12"></div><button class="btn" style="margin-top:10px" onclick="sch=1;go('evc')">Schedule visit</button>${sch?`<div class="toast b-ok" role="status">Scheduled for 12 Nov. Committee notified ${SIM}</div>`:''}</div>
<div class="card"><h2>Scheduled</h2>${tbl(['Case','Date','Status'],[['APP-2026-0017','4 Nov 2026',B('Confirmed','ok','✓')],['APP-2026-0011','7 Nov 2026',B('Report pending','warn','◐')]])}<p class="who" style="margin:10px 0 0">Rescheduling needs a recorded reason. Visit geotags are ${SIM}</p></div></div>`),
obl:()=>shell('obl',`<h1>Obligations</h1><p class="sub">Submitted and verified are different states. A returned item keeps its history.</p><div class="card">${tbl(['Obligation','Due','Status','Action'],[['Faculty undertaking','20 Nov 2026',B('Awaiting','warn','◐'),'<button class="btn sm">Upload evidence</button>'],['Fire NOC copy','2 Nov 2026',B('Under review','n','○'),'—'],['Audited accounts','10 Oct 2026',B('Returned','bad','↩'),'<button class="btn alt sm">Resubmit</button>'],['Land use affidavit','15 Oct 2026',B('Verified','ok','✓'),'—']])}</div>`),
